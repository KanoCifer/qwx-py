[project]
name = "qwx"
version = "0.1.0"
description = "和风天气（QWeather）开发服务的 Python 客户端"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "KanoCifer" }]
keywords = [
    "qweather",
    "weather",
    "forecast",
    "sdk",
    "air-quality",
    "warning",
    "tide",
    "geo",
    "jwt",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "cryptography>=42",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[project.urls]
Homepage = "https://github.com/KanoCifer/qwx-py"
Source = "https://github.com/KanoCifer/qwx-py"
Documentation = "https://github.com/KanoCifer/qwx-py/tree/main/docs"
Issues = "https://github.com/KanoCifer/qwx-py/issues"
Changelog = "https://github.com/KanoCifer/qwx-py/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qwx"]

[tool.hatch.build.targets.sdist]
# sdist 装的是「给人看源码、顺带能跑测试」的包：带源码、测试、工具、示例与面向
# 使用者的文档；不带 CI 配置、README 素材图与迁移过程文档。
# contract/ 要留 —— tools/ 与 tests/ 的契约对照依赖它。
include = [
  "/src",
  "/tests",
  "/tools",
  "/examples",
  "/live",
  "/docs",
  "/contract",
  "/README.md",
  "/README_EN.md",
  "/LICENSE",
]
exclude = [
  # 迁移过程文档：只对仓库维护者有意义。
  "/docs/MIGRATION_PLAN.md",
  "/docs/P2_SPEC.md",
  "/docs/P3_SPEC.md",
  "/docs/P4_SPEC.md",
  "/docs/P5_SPEC.md",
  # Go 侧抽取基线的人读版：与 contract/ 的 JSON 重复。
  "/docs/contract_baseline.md",
  "/docs/field_map.md",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "tools"]
# docs/ 里是规约文档，代码块是给人看的示例，不参与格式化。
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "N"]
# RUF001/002/003 把中文全角标点报成歧义字符。中文文档里的全角标号是正常的。
ignore = ["N818", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
files = ["src/qwx"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "live: 需要真实凭据的联网冒烟测试",
]
